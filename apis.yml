name: Spring Boot Admin Console
description: >-
  Spring Boot Admin is a community project by codecentric AG that provides a web-based administration UI for managing
  and monitoring Spring Boot applications. It visualizes Spring Boot Actuator endpoints in a graphical interface and
  provides application registration, health monitoring, log level management, metric graphs, instance lifecycle event
  tracking, and notification integrations (email, Slack, PagerDuty, OpsGenie, Hipchat, Teams, Telegram).
url: https://github.com/codecentric/spring-boot-admin
accessModel:
  pricing: enterprise
  onboarding: open
  trial: false
  try_now: false
  public: true
  label: Enterprise · Open access

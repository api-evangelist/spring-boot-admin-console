apis:
- name: Applications API
  description: >-
    Manage registered Spring Boot applications. Applications are logical groupings of instances sharing
    the same name and management URL base.
  baseURL: http://localhost:8080/applications
  humanURL: https://codecentric.github.io/spring-boot-admin/current/#_applications
  tags:
  - Application
  - Registration
  tags_raw:
  - Applications
  - Registration
  properties:
  - type: Documentation
    url: https://codecentric.github.io/spring-boot-admin/current/#_applications
- name: Instances API
  description: >-
    Manage individual application instances. Each instance represents a running Spring Boot application
    registered with the Admin server. Supports health monitoring, Actuator endpoint proxying, and deregistration.
  baseURL: http://localhost:8080/instances
  humanURL: https://codecentric.github.io/spring-boot-admin/current/#_instances
  tags:
  - Actuator
  - Instances
  - Monitoring
  properties:
  - type: Documentation
    url: https://codecentric.github.io/spring-boot-admin/current/#_instances
- name: Events API
  description: >-
    Lifecycle event stream for application instances using Server-Sent Events (SSE). Events include status
    changes, registration, deregistration, and info updates.
  baseURL: http://localhost:8080/instances/events
  humanURL: https://codecentric.github.io/spring-boot-admin/current/#_event-store
  tags:
  - Event
  - Notification
  - SSE
  tags_raw:
  - Events
  - Notifications
  - SSE
  properties:
  - type: Documentation
    url: https://codecentric.github.io/spring-boot-admin/current/#_event-store
- name: Notifications API
  description: >-
    Configure and trigger notification channels for application lifecycle events. Supports email, Slack,
    PagerDuty, OpsGenie, Microsoft Teams, Telegram, and custom webhook notifications.
  baseURL: http://localhost:8080
  humanURL: https://codecentric.github.io/spring-boot-admin/current/#_notifications
  tags:
  - Alerts
  - Notification
  - Webhook
  tags_raw:
  - Alerts
  - Notifications
  - Webhooks
  properties:
  - type: Documentation
    url: https://codecentric.github.io/spring-boot-admin/current/#_notifications
